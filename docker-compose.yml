# Banking Data Warehouse (Kimball) -- CO5173 Group 27 -- Phase 2 (Berka)
# Logical architecture agreed in the group sheet (2026-10-18):
#   A Source (data/berka)  B Data Lake (lake/)  C Pipeline (spark)  D Data Warehouse (clickhouse)
#   E Operational store (postgres)  F Application (app)  + backup area (backups/)
# Docker Desktop has 8 GB RAM here; the limits below total 7 GB.
name: bankdw

services:
  # D. Data Warehouse. Started only when CLICKHOUSE_HOST is "clickhouse" (default);
  # with a cloud service in .env the Makefile leaves the "local-ch" profile off.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: bankdw-clickhouse
    profiles: ["local-ch"]
    ports:
      - "8123:8123"            # HTTP (clickhouse-connect)
      - "9000:9000"            # native protocol
    environment:
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./warehouse/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./warehouse/clickhouse/config.d/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - ./warehouse/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./warehouse/clickhouse/config.d/system_logs.xml:/etc/clickhouse-server/config.d/system_logs.xml:ro
      - ./lake:/var/lib/clickhouse/user_files/lake      # B -> D: ClickHouse reads Parquet with file()
      - ./backups:/backups                               # BR07 backup area
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2500m

  # E. Operational store: runs, steps, rejected records, alerts, alert actions, backup catalog
  postgres:
    image: postgres:16.4-alpine
    container_name: bankdw-postgres
    # shared_buffers as in the Phase 1 benchmark (default 128MB); the rest is set per benchmark session
    command: ["postgres", "-c", "shared_buffers=256MB"]
    # /dev/shm is 64 MB by default: parallel workers on the x10 benchmark data need more (P2-8)
    shm_size: 256m
    ports:
      - "5433:5432"            # 5432 is used by another project on this machine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bankops
    volumes:
      - ops-data:/var/lib/postgresql/data
      - ./warehouse/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bankops"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # C. Pipeline (PySpark, local mode). Jobs run with `make` (docker compose exec) or are started by
  # the app through the runner (http://spark:8000, Docker network only, allow-listed commands).
  spark:
    build: ./spark
    image: bankdw-spark:3.5.6-p2
    container_name: bankdw-spark
    command: ["python3", "/opt/jobs/runner.py"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    environment: &db-env
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bank}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bank}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      CLICKHOUSE_DATABASE_ENGINE: ${CLICKHOUSE_DATABASE_ENGINE:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: bankops
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    volumes:
      - ./data/berka:/data/source:ro          # A. Berka CSV + simulated membership tier
      - ./lake:/lake                          # B. Data Lake (batch snapshots, staging)
      - ./spark/jobs:/opt/jobs:ro
      - ./warehouse:/opt/warehouse:ro         # DDL for ClickHouse and PostgreSQL
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy, required: false }
    mem_limit: 3g

  # F. Application: one Streamlit app, three tabs (Tổng quan / Phân tích / Vận hành)
  app:
    build: ./apps/app
    image: bankdw-app:p2
    container_name: bankdw-app
    ports:
      - "8501:8501"
    environment:
      <<: *db-env
      RUNNER_URL: http://spark:8000
    depends_on:
      postgres: { condition: service_healthy }
      spark: { condition: service_healthy }
      clickhouse: { condition: service_healthy, required: false }
    mem_limit: 512m

  # Read-only copy for the members (APP_MODE=viewer): BR01, BR02, BR08 and SQL on ClickHouse only.
  # Local test: docker compose --profile viewer up -d app-viewer  ->  http://localhost:8502
  app-viewer:
    image: bankdw-app:p2
    container_name: bankdw-app-viewer
    profiles: ["viewer"]
    ports:
      - "8502:8501"
    environment:
      <<: *db-env
      APP_MODE: viewer
    depends_on:
      clickhouse: { condition: service_healthy, required: false }
    mem_limit: 512m

volumes:
  clickhouse-data:
  ops-data:
