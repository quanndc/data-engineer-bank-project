# Banking Data Warehouse (Kimball) -- CO5173 Group 27
# Core services for P0-P2: Kafka, ClickHouse, Spark.
# Docker Desktop has 8 GB RAM here; limits below keep the stack under ~6.5 GB.
name: bankdw

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: bankdw-kafka
    ports:
      - "9094:9094"            # host access (EXTERNAL listener)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1g

  # Local ClickHouse. Started only when CLICKHOUSE_HOST is "clickhouse" (the default);
  # with a cloud service in .env the Makefile leaves this profile off.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: bankdw-clickhouse
    profiles: ["local-ch"]
    ports:
      - "8123:8123"            # HTTP (Superset, clickhouse-connect)
      - "9000:9000"            # native protocol
    environment:
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./warehouse/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./lake:/var/lib/clickhouse/user_files/lake      # Parquet core layer written by Spark (entrypoint chowns it, so not :ro)
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2500m

  spark:
    build: ./spark
    image: bankdw-spark:3.5.6
    container_name: bankdw-spark
    command: ["sleep", "infinity"]   # jobs are run with `make` via docker compose exec
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bank}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bank}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      CLICKHOUSE_DATABASE_ENGINE: ${CLICKHOUSE_DATABASE_ENGINE:-}
    volumes:
      - ./data:/data/source:ro       # Kaggle CSV files
      - ./lake:/lake                 # raw / staging / core Parquet layers
      - ./spark/jobs:/opt/jobs:ro
      - ./ingestion:/opt/ingestion:ro
      - ./warehouse:/opt/warehouse:ro              # DDL, BR queries, seeds (city mapping)
      - ./benchmark:/opt/benchmark:ro              # P6 benchmark scripts
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy, required: false }
    mem_limit: 3g

  # ------------------------------------------------------------ application (P5)
  # Started with `make app-up` (profile "app"), so the data pipeline stays lean.
  superset:
    build: ./apps/superset
    image: bankdw-superset:4.1.3
    container_name: bankdw-superset
    profiles: ["app"]
    ports:
      - "8088:8088"
    env_file: .env
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username "$$SUPERSET_ADMIN_USER" --firstname Admin \
           --lastname BankDW --email admin@bankdw.local --password "$$SUPERSET_ADMIN_PASSWORD" || true) &&
        superset init &&
        /usr/bin/run-server.sh
    volumes:
      - superset-home:/app/superset_home
      - ./apps/superset:/opt/bootstrap:ro
      - ./warehouse/queries:/opt/queries:ro
    depends_on:
      clickhouse: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1500m

  streamlit:
    build: ./apps/streamlit
    image: bankdw-streamlit:1.40
    container_name: bankdw-streamlit
    profiles: ["app"]
    ports:
      - "8501:8501"
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bank}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bank}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
    depends_on:
      clickhouse: { condition: service_healthy, required: false }
    mem_limit: 512m

  # ------------------------------------------------------------ benchmark (P6)
  # Alternative solution A2: the same star schema in a row store. `make bench-up`.
  postgres:
    image: postgres:16.4-alpine
    container_name: bankdw-postgres
    profiles: ["bench"]
    ports:
      - "5433:5432"            # 5432 is used by another project on this machine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

volumes:
  kafka-data:
  clickhouse-data:
  superset-home:
  postgres-data:
