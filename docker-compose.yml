# Banking Data Warehouse (Kimball) -- CO5173 Group 27
# Core services for P0-P2: Kafka, ClickHouse, Spark.
# Docker Desktop has 8 GB RAM here; limits below keep the stack under ~6.5 GB.
name: bankdw

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: bankdw-kafka
    ports:
      - "9094:9094"            # host access (EXTERNAL listener)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1g

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: bankdw-clickhouse
    ports:
      - "8123:8123"            # HTTP (Superset, clickhouse-connect)
      - "9000:9000"            # native protocol
    environment:
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./warehouse/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./lake:/var/lib/clickhouse/user_files/lake      # Parquet core layer written by Spark (entrypoint chowns it, so not :ro)
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2500m

  spark:
    build: ./spark
    image: bankdw-spark:3.5.6
    container_name: bankdw-spark
    command: ["sleep", "infinity"]   # jobs are run with `make` via docker compose exec
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank
    volumes:
      - ./data:/data/source:ro       # Kaggle CSV files
      - ./lake:/lake                 # raw / staging / core Parquet layers
      - ./spark/jobs:/opt/jobs:ro
      - ./ingestion:/opt/ingestion:ro
      - ./warehouse/seeds:/opt/seeds:ro            # curated reference data (city mapping)
      - ./warehouse/clickhouse:/opt/warehouse:ro   # ClickHouse DDL used by the loader
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    mem_limit: 3g

volumes:
  kafka-data:
  clickhouse-data:
